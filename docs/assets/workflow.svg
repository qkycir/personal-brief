<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="540" viewBox="0 0 1440 540" role="img" aria-labelledby="title desc">
  <title id="title">Personal Brief 的两阶段流程</title>
  <desc id="desc">授权来源经采集会话进入 SQLite，整理会话对账并回原文核验，再输出 Markdown 和可选系统提醒。两个会话复用，定时由宿主提供。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="#78968A" stroke-width="1.4"/></marker></defs>
  <style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:24px;font-weight:650;fill:#203D34}.body{font-size:18px;fill:#60796D}.step{font-size:14px;fill:#4C7D65;letter-spacing:1px}</style>
  <rect x="1" y="1" width="1438" height="538" rx="24" fill="#F7FAF8" stroke="#DDE7E0"/>
  <text x="44" y="61" font-size="30" font-weight="650" fill="#183D34">两个会话，一条有依据的信息链</text>
  <text x="44" y="96" font-size="18" fill="#6A8074">每轮轻量对账；有新增或变化时，才进一步核验与更新。</text>
  <g fill="none" stroke="#78968A" stroke-width="2" marker-end="url(#arrow)">
    <path d="M274 248h36"/><path d="M550 248h36"/><path d="M826 248h36"/><path d="M1102 248h36"/>
  </g>
  <g>
    <rect x="44" y="150" width="230" height="202" rx="17" fill="#FFFFFF" stroke="#D7E3DB"/>
    <text x="66" y="183" class="step">01 / 授权来源</text>
    <text x="66" y="230" class="title">QQ · 微信</text>
    <text x="66" y="269" class="body">Computer Use 读取</text>
    <text x="66" y="302" class="body">可选：邮箱、逐字稿</text>
    <rect x="320" y="150" width="230" height="202" rx="17" fill="#EAF2EC" stroke="#CDDFD1"/>
    <text x="342" y="183" class="step">02 / 采集会话</text>
    <text x="342" y="230" class="title">记录事实与进度</text>
    <text x="342" y="269" class="body">原文时间 · 引用关系</text>
    <text x="342" y="302" class="body">读取边界 · 覆盖缺口</text>
    <rect x="596" y="150" width="230" height="202" rx="17" fill="#FFFFFF" stroke="#D7E3DB"/>
    <text x="618" y="183" class="step">03 / 本地记录</text>
    <text x="618" y="230" class="title">SQLite</text>
    <text x="618" y="269" class="body">来源 · 事件 · 任务</text>
    <text x="618" y="302" class="body">校验后交接同一轮次</text>
    <rect x="872" y="150" width="230" height="202" rx="17" fill="#183D34"/>
    <text x="894" y="183" font-size="14" fill="#B0D5BC" letter-spacing="1">04 / 整理会话</text>
    <text x="894" y="230" font-size="24" font-weight="650" fill="#F0F8F2">判断、核验、对账</text>
    <text x="894" y="269" font-size="18" fill="#B9D1C5">先核对原文与适用性</text>
    <text x="894" y="302" font-size="18" fill="#B9D1C5">再创建或更新待办</text>
    <rect x="1148" y="150" width="248" height="202" rx="17" fill="#EDF3E1" stroke="#D7E3C1"/>
    <text x="1170" y="183" class="step">05 / 可查看的结果</text>
    <text x="1170" y="230" class="title">简报与待办</text>
    <text x="1170" y="269" class="body">Markdown 自动导出</text>
    <text x="1170" y="302" class="body">可选：Apple 提醒事项</text>
  </g>
  <path d="M987 352v66H159v-58" fill="none" stroke="#78968A" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <rect x="432" y="402" width="288" height="32" rx="16" fill="#F7FAF8"/>
  <text x="449" y="425" font-size="17" fill="#4B6D5C">需要变更时，整理者亲自回原文</text>
  <text x="44" y="491" font-size="16" fill="#698174">偏好与个人信息独立保存 · 按授权范围读取 · 持续记录采集进度</text>
  <text x="1159" y="491" font-size="15" fill="#698174">PERSONAL BRIEF</text>
</svg>
