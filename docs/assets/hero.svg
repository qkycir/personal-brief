<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">Personal Brief：消息很多，重要的事别漏掉</title>
  <desc id="desc">通过 Computer Use 读取授权的 QQ 和微信，记录出处，核验后整理待办。右侧为虚构信息卡片，不是真实聊天截图。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F3F8F5"/><stop offset="1" stop-color="#E1EEE8"/></linearGradient>
    <linearGradient id="card" x2="1" y2="1"><stop stop-color="#183D34"/><stop offset="1" stop-color="#102B26"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#A6C3B5" opacity=".4"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#214D40" flood-opacity=".12"/></filter>
  </defs>
  <style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}.muted{fill:#63786E}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
  <rect x="1" y="1" width="1438" height="618" rx="28" fill="url(#bg)" stroke="#D3E2D9"/>
  <rect x="780" y="28" width="620" height="555" fill="url(#dots)"/>
  <g transform="translate(64 58)">
    <rect width="42" height="42" rx="13" fill="#173F34"/>
    <path d="M12 14h18v13H19l-7 5z" fill="none" stroke="#C7F4A7" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="m17 20 3 3 6-6" fill="none" stroke="#C7F4A7" stroke-width="2"/>
    <text x="58" y="28" font-size="29" fill="#183D34" font-weight="650" letter-spacing="-.8">personal brief</text>
  </g>
  <text x="64" y="190" font-size="18" font-weight="600" fill="#527367" letter-spacing="3">QQ · 微信 · COMPUTER USE</text>
  <text x="60" y="277" font-size="68" font-weight="750" fill="#183D34" letter-spacing="-2">消息很多。</text>
  <text x="60" y="365" font-size="68" font-weight="750" fill="#183D34" letter-spacing="-2">重要的事，别漏掉。</text>
  <text x="64" y="422" font-size="23" class="muted">读取授权会话，核对原文，把通知变成可追溯的待办。</text>
  <g font-size="17" font-weight="550" fill="#355D4E">
    <rect x="64" y="476" width="130" height="40" rx="20" fill="#D7E8DE"/><text x="95" y="502">界面读取</text>
    <rect x="208" y="476" width="130" height="40" rx="20" fill="#D7E8DE"/><text x="239" y="502">增量采集</text>
    <rect x="352" y="476" width="130" height="40" rx="20" fill="#D7E8DE"/><text x="383" y="502">原文核验</text>
  </g>
  <text x="64" y="566" font-size="15" class="muted">A SKILL FOR YOUR AGENT  /  采集与整理，分工协作</text>
  <g filter="url(#shadow)">
    <rect x="876" y="96" width="446" height="134" rx="18" fill="#FFFFFF" stroke="#DCE7E0"/>
    <rect x="898" y="116" width="58" height="30" rx="10" fill="#EAF0FA"/><text x="913" y="137" font-size="16" fill="#516A91" font-weight="650">QQ</text>
    <text x="968" y="137" font-size="18" fill="#547264">示例项目群</text>
    <text x="900" y="178" font-size="24" fill="#183D34" font-weight="600">周五 17:00 前提交项目周报。</text>
    <text x="900" y="208" font-size="16" class="muted">记录原始日期 · 读取完整要求</text>
    <rect x="830" y="249" width="400" height="95" rx="18" fill="#FFFFFF" stroke="#DCE7E0"/>
    <rect x="851" y="269" width="64" height="30" rx="10" fill="#E7F4DE"/><text x="868" y="290" font-size="16" fill="#4B7540" font-weight="650">微信</text>
    <text x="930" y="291" font-size="21" fill="#183D34">有更新？先核对，再修改。</text>
    <text x="853" y="325" font-size="15" class="muted">同一事项合并 · 尊重手动完成</text>
    <rect x="888" y="370" width="446" height="168" rx="20" fill="url(#card)"/>
    <circle cx="925" cy="412" r="13" fill="#C8F3A8"/><path d="m919 412 4 4 8-9" stroke="#1B4938" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="953" y="420" font-size="26" font-weight="650" fill="#F4F9F5">提交项目周报</text>
    <text x="912" y="461" font-size="19" fill="#C3D8CF">截止日期、原始来源与通知时间一起保留。</text>
    <path d="M912 481h398" stroke="#35584C"/>
    <text x="912" y="510" font-size="15" fill="#A4C6B4">示例 · 从消息到待办</text>
    <text x="1190" y="510" font-size="15" fill="#C8F3A8">PERSONAL BRIEF</text>
  </g>
</svg>
